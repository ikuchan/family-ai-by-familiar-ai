[project]
name = "familiar-ai"
version = "0.6.0"
description = "AI that lives alongside you — with eyes, voice, memory and person awareness"
requires-python = ">=3.10"
dependencies = [
    # LLM backends
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "google-genai>=1.0",
    "google-generativeai>=0.8.6",
    # Database — PostgreSQL + pgvector
    "psycopg2-binary>=2.9.9",
    # Embeddings
    "sentence-transformers>=3.0.0",
    "numpy>=1.24.0",
    # Hardware / IoT
    "tinytuya>=1.15.0",
    # HTTP / async
    "aiohttp>=3.9.0",
    # TUI
    "textual>=8.0.0",
    "textual-autocomplete>=4.0.6",
    # MCP
    "mcp>=1.0.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "uvloop>=0.22.1; sys_platform != 'win32'",
    "ultralytics>=8.4.81",
    "faster-whisper>=1.2.1",
    "speechbrain>=1.1.0",
    "torchaudio==2.10.0",
    "insightface>=1.0.1",
    # CUDA-12 版 onnxruntime-gpu（1.27+）は Python>=3.11 が必要。requires-python は 3.10 の
    # ままにし、GPU 版は 3.11+ でだけ要求する（3.10 では顔認識が無効化されるだけ）。
    "onnxruntime-gpu>=1.24.3 ; python_version >= '3.11'",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7.0", "qasync>=0.27.0"]
camera = [
    "opencv-python>=4.00",
    "onvif-zeep-async>=4.0.0",
    "Pillow>=10.0.0",
    "zeroconf>=0.132.2",
]
voice = [
    "openai-whisper",
    "sounddevice>=0.5.5",
    "soundfile>=0.13.1",
    "av>=14.0.0",
]
recognition = [
    # Face recognition (optional)
    "deepface>=0.0.93",
    "tf-keras>=2.16.0",
    # Speaker identification (optional)
    "resemblyzer>=0.1.3",
]
all = ["familiar-ai[gui,camera,voice,recognition]"]

[project.scripts]
familiar = "familiar_agent.main:main"
familiar-discover-cameras = "familiar_agent.camera_discovery:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/familiar_agent"]

[tool.uv]
default-groups = ["dev", "camera", "voice"]
# insightface が依存として引き込む CPU 版 onnxruntime を無効化する。onnxruntime-gpu が
# 同じ import 名前空間を提供するため実行時は満たされる。マーカーが常に偽なので、どの
# プラットフォームでも CPU 版は入らない（GPU 版と同じ onnxruntime/ を奪い合う事故を防ぐ）。
override-dependencies = ["onnxruntime; sys_platform == 'nonexistent'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
# 既定 PyPI の onnxruntime-gpu は CUDA 13 版（libcudart.so.13 を要求）。環境は torch と
# 揃えた CUDA 12.8（cudnn 9.10 cu12）なので、CUDA-12 版を公式の CUDA-12 索引から入れる。
onnxruntime-gpu = { index = "onnxruntime-cuda12" }

[[tool.uv.index]]
name = "pytorch-cpu"
url  = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "onnxruntime-cuda12"
url  = "https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/onnxruntime-cuda-12/pypi/simple/"
explicit = true

[tool.pytest.ini_options]
markers = [
    "invariant: システムが守ると言っていることの生存確認（実 DB を使う・通常の一式とは別群で走らせる）",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    "E401",  # multiple imports on one line (intentional in some places)
    "E701",  # multiple statements on one line (colon) — intentional compact style
    "E702",  # multiple statements on one line (semicolon) — intentional compact style
]

[tool.mypy]
ignore_missing_imports = true
python_version = "3.10"

[dependency-groups]
dev      = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "mypy>=1.10.0",
    "pre-commit>=4.5.1",
    "ruff>=0.4.0",
    "pytest-xdist>=3.8.0",
]
gui      = ["PySide6>=6.7.0", "qasync>=0.27.0"]
camera   = ["opencv-python>=4.00", "onvif-zeep-async>=4.0.0", "Pillow>=10.0.0", "zeroconf>=0.132.2"]
voice    = ["openai-whisper", "sounddevice>=0.5.5", "soundfile>=0.13.1", "av>=14.0.0"]
