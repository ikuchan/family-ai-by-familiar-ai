[project]
name = "familiar-ai"
version = "0.6.0"
description = "AI that lives alongside you — with eyes, voice, memory and person awareness"
requires-python = ">=3.10"
dependencies = [
    # LLM backends
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "google-genai>=1.0",
    "google-generativeai>=0.8.6",
    # Database — PostgreSQL + pgvector
    "psycopg2-binary>=2.9.9",
    # Embeddings
    "sentence-transformers>=3.0.0",
    "numpy>=1.24.0",
    # Hardware / IoT
    "tinytuya>=1.15.0",
    # HTTP / async
    "aiohttp>=3.9.0",
    # TUI
    "textual>=8.0.0",
    "textual-autocomplete>=4.0.6",
    # MCP
    "mcp>=1.0.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "uvloop>=0.22.1; sys_platform != 'win32'",
    "ultralytics>=8.4.81",
    "faster-whisper>=1.2.1",
    "speechbrain>=1.1.0",
    "torchaudio==2.10.0",
    "insightface>=1.0.1",
    "onnxruntime-gpu>=1.24.3",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7.0", "qasync>=0.27.0"]
camera = [
    "opencv-python>=4.00",
    "onvif-zeep-async>=4.0.0",
    "Pillow>=10.0.0",
    "zeroconf>=0.132.2",
]
voice = [
    "openai-whisper",
    "sounddevice>=0.5.5",
    "soundfile>=0.13.1",
    "av>=14.0.0",
]
recognition = [
    # Face recognition (optional)
    "deepface>=0.0.93",
    "tf-keras>=2.16.0",
    # Speaker identification (optional)
    "resemblyzer>=0.1.3",
]
all = ["familiar-ai[gui,camera,voice,recognition]"]

[project.scripts]
familiar = "familiar_agent.main:main"
familiar-discover-cameras = "familiar_agent.camera_discovery:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/familiar_agent"]

[tool.uv]
default-groups = ["dev", "camera", "voice"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url  = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    "E401",  # multiple imports on one line (intentional in some places)
    "E701",  # multiple statements on one line (colon) — intentional compact style
    "E702",  # multiple statements on one line (semicolon) — intentional compact style
]

[tool.mypy]
ignore_missing_imports = true
python_version = "3.10"

[dependency-groups]
dev      = ["pytest>=9.0.2", "pytest-asyncio>=1.3.0", "mypy>=1.10.0", "pre-commit>=4.5.1", "ruff>=0.4.0"]
gui      = ["PySide6>=6.7.0", "qasync>=0.27.0"]
camera   = ["opencv-python>=4.00", "onvif-zeep-async>=4.0.0", "Pillow>=10.0.0", "zeroconf>=0.132.2"]
voice    = ["openai-whisper", "sounddevice>=0.5.5", "soundfile>=0.13.1", "av>=14.0.0"]
