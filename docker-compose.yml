services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: familiar
      POSTGRES_PASSWORD: familiar
      POSTGRES_DB: familiar_ai
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familiar -d familiar_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-test:
    image: pgvector/pgvector:pg16
    profiles: ["test"]
    # スキーマは pgdata-test に残る（毎回は作り直さない）。マイグレーションは
    # schema_migrations に記録が残るぶん2回目以降 skip されるので、初回適用が
    # 検証されるのは新しいマイグレーションを足した最初の1回だけである。
    # コードを巻き戻しても列は戻らないため、そのときは
    # `docker volume rm family-ai-by-familiar-ai_pgdata-test` で作り直す
    # （`down -v` は本番の pgdata も消すので使わない）。
    # fsync/WAL 同期を切って、並列化で増えた複数 DB があっても起動・再起動を速くする。
    # 本番 db には付けない。
    command:
      - "postgres"
      - "-c"
      - "fsync=off"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "full_page_writes=off"
    environment:
      POSTGRES_USER: familiar
      POSTGRES_PASSWORD: familiar
      POSTGRES_DB: familiar_test
    volumes:
      - pgdata-test:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familiar -d familiar_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  pgdata-test:
