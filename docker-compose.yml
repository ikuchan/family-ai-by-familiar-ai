services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: familiar
      POSTGRES_PASSWORD: familiar
      POSTGRES_DB: familiar_ai
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familiar -d familiar_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://familiar:familiar@db:5432/familiar_ai
    volumes:
      - familiar_data:/root/.familiar_ai
    stdin_open: true
    tty: true

volumes:
  pgdata:
  familiar_data:
