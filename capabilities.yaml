capabilities:
  - id: autonomous_initiation
    summary: Speak up or act on its own when an inner urge fires, without waiting to be addressed
    detail: >
      Five urges (seeking, rest, bond, safety, esteem) build up over time and fire at a
      threshold; the firing starts a turn of its own. Only bond (wanting company) and
      esteem (wanting to be useful) try to talk to someone; seeking, safety and rest act
      without speaking (look around, turn the head, rest), and their words stay unspoken.
      When bond or esteem speaks, it talks to the person rather than musing aloud:
      politely and briefly, careful not to startle, and first asking whether now is a
      good time to talk.
      Bond and esteem build up only while the camera sees a person, and ebb at a third of
      that speed while nobody is seen; at night (23-7) they build up at 0.083 times the
      speed. An urge speaks aloud only when the camera sees someone; otherwise what it
      wanted to say is kept as a note to that person ("〇〇に言いたかったこと"), which recall
      brings back later and which is folded away once it has been said in a spoken reply.
      Arrivals, departures and new notes are only recorded; they never make the agent
      start talking. Implemented in `core/drive_dynamics.py`, `loop/tonic.py` and
      `core/unsaid.py`.
    enabled: true
  - id: wake_word
    summary: Listen only after being called by name, both to speech and to typed text
    detail: >
      Input is taken as conversation only after the agent's name from ME.md opens it:
      the name must come first (spaces and punctuation before it are skipped, but words
      such as "ねえ" or "あのさ" before it are not), with one letter of difference allowed,
      whether spoken or typed. A name in the middle of a sentence does not count.
      Hearing the name opens a 30-second window; each accepted input, reply or filler
      extends it by 30 seconds. The window is judged by when the input arrived. Input
      outside the window is dropped without side effects: nothing in progress is
      interrupted, and the screen shows it only as "聞いていない" in the status line, not
      in the conversation log. If no name is set in ME.md, nothing is taken as
      conversation. Only an input that carries the name interrupts what the agent is
      doing (a search, a reply being thought out, a timer announcement); an input without
      the name waits until the ongoing request has answered. Timer control words also
      need the name ("パジュ、止めて"). A reply finished after the window has closed is not
      spoken. Asked to be quiet inside the window, the agent stays quiet for 30 minutes by
      default (at most 60); it speaks again only when someone says its name together
      with "話していいよ" in one utterance, or when the time is up. Implemented in
      `core/wake_window.py` and `loop/event_loop.py`.
    enabled: true
  - id: camera_vision
    summary: Capture and interpret images from a camera (RTSP or USB webcam)
    detail: >
      `see()` captures a camera frame and describes the scene via vision LLM.
      `look(direction, degrees)` rotates the camera head via ONVIF PTZ.
      Uses the `tools/camera.py` module.
    enabled_env: CAMERA_HOST
  - id: deferred_fetch
    summary: Asynchronously fetch content from a URL and inject it on the next turn
    detail: >
      Used for fire-and-forget URL fetching. The result is made available in the
      agent's workspace on the subsequent turn. Implemented in `tools/deferred_fetch.py`.
    enabled: true
  - id: deferred_search
    summary: Asynchronously perform a search and inject results on the next turn
    detail: >
      Enables fire-and-forget search queries. The search results are delivered to
      the agent's workspace on the subsequent turn. Implemented in `tools/deferred_search.py`.
    enabled: true
  - id: memory
    summary: Store and recall observations, episodes, semantic facts, and unfinished business
    detail: >
      Observations are embedded and stored in PostgreSQL with pgvector for vector
      search. Recall uses cosine similarity over situated embeddings. Episodes group
      related memories. Semantic facts and behavior policies are extracted from
      observations. Uses the `tools/memory.py` module and `DATABASE_URL` environment variable.
    enabled: true
  - id: mic_capture
    summary: Capture audio from a microphone
    detail: >
      Streams PCM 16 kHz 16-bit mono audio to an async callback. Primarily used
      for speech input. Implemented in `tools/mic.py`.
    enabled: true
  - id: person_identification
    summary: Identify and track multiple family members as distinct individuals
    detail: >
      The agent is designed for shared household use: multiple family members
      interact with the same instance, each with a separate memory space,
      relationship state, and perspective vector. PersonMemoryManager routes
      memory writes to the current speaker and reads across all present persons.
      Who is speaking is known from four sources: the `/speaker` command; a name the
      person says aloud (judged by Jev and matched against FAMILY.md in
      `core/speaker_claim.py`); a guess from a photo the agent took (confidence is
      capped, `core/seen_people.py`); and whether anyone is in view at all (YOLO person
      detection in `presence_sensor.py`, which cannot tell who it is). Face recognition
      and voice-print identification exist in the recognition package but are not
      wired in yet, so the agent cannot recognise a face or a voice by itself.
      Uses the `person_memory_manager.py` module.
      People who do not live in the house (grandparents, relatives, friends, guests)
      are written in PEOPLE.md in the same format as FAMILY.md. The agent knows who
      they are and can name them in a photo, but they never become the speaker and
      get no memory space of their own; what is said with them stays in the shared
      memory.
    enabled: true
  - id: realtime_stt
    summary: Transcribe spoken audio in real-time
    detail: >
      Continuous listening. Audio is transcribed locally by faster-whisper by
      default (STT_ENGINE=whisper, model large-v3 on cuda, no API key needed), with
      silero-vad marking speech boundaries; STT_ENGINE=elevenlabs switches to the
      ElevenLabs WebSocket API (Scribe v2) instead. Implemented in
      `tools/realtime_stt.py` and `realtime_stt_session.py`.
    enabled: true
  - id: stt
    summary: Transcribe a recorded stretch of spoken audio
    detail: >
      Records audio from the local PC microphone (via sounddevice) or a camera RTSP
      stream (via PyAV) as a fallback, then transcribes it. Transcription runs
      locally on faster-whisper by default (STT_ENGINE=whisper, no API key needed);
      STT_ENGINE=elevenlabs uses the ElevenLabs Scribe API instead. Implemented in
      `tools/stt.py` and `tools/local_stt.py`.
    enabled: true
  - id: tts
    summary: Speak responses aloud via text-to-speech
    detail: >
      The Text-to-Speech tool generates spoken output for the agent. Three engines
      are available, selected with TTS_ENGINE: `gemini` (Gemini TTS, streamed,
      GEMINI_TTS_MODEL default gemini-3.8-flash-lite-tts with voice Charon, reusing
      the utility LLM's API key), `sbv2` (a local Style-Bert-VITS2 server, voice
      jvnv-M2-jp, no API key and no network needed) and `elevenlabs` (external API).
      A second engine can be named in TTS_FALLBACK: when the main one cannot speak,
      the spare is tried once, so a network outage does not leave the agent silent.
      The spare is warmed up at startup. Each engine is handed a different text:
      ElevenLabs cannot read kanji so the whole line is converted to hiragana,
      SBV2 reads kanji itself but needs a small table of corrections, and Gemini is
      given the line unchanged. Audio plays on the PC speaker and/or a camera
      speaker via go2rtc. VoiceGuard prevents TTS output from feeding back into STT.
      While someone is kept waiting in a conversation, a short filler line tells them
      they were heard and are not being ignored: only when the answer takes more than
      5 seconds, then every 20 seconds, and never the same words twice. The filler
      plays in the background, so lookups and the reply keep going, and the reply
      waits until 1 second after the filler has finished. Besides `say` (the reply),
      the reply may use a second voice tool `filler` for its opening; it is kept apart
      from `say` because a filler given as `say` reads as the reply already given.
      Fillers already spoken are placed in the reply's conversation as the agent's own
      `filler` calls, and words the reply repeats at its start are dropped before
      speaking.
      Implemented in `tools/tts.py`.
    enabled: true
  - id: appraisal_engine
    summary: Deterministically update affective state based on inputs
    detail: >
      Affective state is updated each turn from the pleasure, displeasure and
      dominance that Jev (the judging model) scores for the incoming observation.
      In a conversation, Jev also reads how the person seems from their words (keen,
      happy, tired, or frustrated) and the reply is told "[相手の様子] パパは疲れていそう",
      so it can match their mood; nothing is said when it cannot tell. The judging
      lives in `loop/evaluator.py` and `core/jev_judges.py`; the PAD dataclass, the
      label quantisation and the mood register live in `emotion_pad.py` and
      `mood_register.py`.
    enabled: true
  - id: music
    summary: Play the family's Spotify playlists, say what is playing, and remember it
    detail: >
      `play_music` plays a playlist named in MUSIC.md ("パジュ、ケイマンかけて"), in order
      or shuffled; `stop_music`, `next_track` and `music_volume` stop it, skip a song and
      turn it up or down. It plays through spotifyd on this machine. While music plays,
      only music words (stop, next, louder, softer, a playlist name) are heard, unless
      the utterance starts with the agent's name, in which case anything is heard
      ("パジュ、いま何の曲？"). The song now playing, its artist and the volume are shown
      as [音楽] on every turn, so the agent can say what is playing. Each new song and
      the moment the music stops (the playlist ended or it was stopped elsewhere) are
      kept in memory, so it can later recall what was listened to. The music is turned
      down to a quarter while the agent speaks, and stops by itself after 30 minutes.
      Implemented in `tools/music.py`, `io/music.py` and `loop/music_watch.py`.
    enabled_tool: play_music
  - id: mcp_client
    summary: Manage connections to external MCP servers
    detail: >
      The Model Context Protocol (MCP) client manager handles connections to external
      MCP servers, exposing their tools to the agent. Supported transports include
      stdio and SSE. Implemented in `mcp_client.py`.
    enabled_env: MCP_CONFIG
  - id: family_schedule
    summary: Look up the family's schedule for today or the coming days
    detail: >
      `get_family_schedule` returns what is on the family calendar — today by
      default, or the next few days when asked — with the current date, weekday
      and time already written at the top, so there is no need to work out what
      day it is. Use it when someone asks about today's or tomorrow's plans, or
      what time something starts. The schedule lives in the family's calendar,
      not in the agent's memory, so it is never mixed into recall, and it says
      when it was fetched. Anyone in the family may ask.
      Treated as a tool: read it when the question needs what is on the
      calendar, not on every turn.
    enabled_tool: get_family_schedule
  - id: notion_memo
    summary: Search the family's written notes and read the daily log
    detail: >
      `search_notion` searches the table of contents of the family's written
      notes (page name, a one-line abstract, where the note lives, when it was
      updated). Use it when someone asks what was decided before, how something
      came about, or whether something is written down somewhere. It returns
      the table of contents, not the full text. `get_journal` returns the last
      few days of the daily log (morning mood, fatigue, sleep). Both live in
      the family's notes, not in the agent's memory, so they are never mixed
      into recall, and both say when they were fetched. Anyone in the family
      may ask. Treated as tools: read them when the question needs what is
      written down, not on every turn.
    enabled_tool: search_notion
  - id: house_rules
    summary: Look up the rules the family currently lives by
    detail: >
      `get_house_rules` returns the household rules in force right now — which
      days games and YouTube are allowed, how long, breaks, the three minutes of
      exercise on getting home. The reply already says what day it is in JST and
      whether today is a game day, so there is no need to work that out.
      Use it when a child asks whether they may play, or whenever the rules
      themselves matter. It returns what is agreed now, not a memory of a past
      conversation — and it says when it was last updated.
      The rules live in the family's notes, not in the agent's memory, so they
      are never mixed into recall. Anyone in the family may ask.
      Treated as a tool: read it when the question needs what is written down,
      not on every turn.
    enabled_tool: get_house_rules
  - id: family_notes_deep_question
    summary: Ask a long question of the family's own written records (Yusuke only)
    detail: >
      `ask_vault_yusuke` is not a search. A session that can read the whole
      three-year archive of notes reads, thinks, and answers — so it takes tens
      of seconds and must ride the deferred path, never a synchronous wait.
      NOT CONNECTED YET (2026-09-04). The archive holds private material, so this
      tool must be absent from the tool list on anyone else's turn. The speaker
      gate is this side's responsibility — the server cannot see who is talking.
      Until that gate exists, this capability stays off. See the design note
      `設計方針_家の記録との接続`.
    enabled: false
  - id: default_mode_network
    summary: Process spontaneous memory recall during idle time
    detail: >
      Inspired by the brain's Default Mode Network. On idle cycles (no workspace
      winner) the agent refreshes its self-understanding from capabilities.yaml.
      Driven from `agent.py` and `capability_state.py`.
    enabled: true
  - id: global_workspace
    summary: Integrate information from various processing modules
    detail: >
      The Global Workspace, inspired by GWT/GNWT, acts as an integration layer
      where specialized processors compete for a shared workspace, broadcasting
      their content. The competition and broadcast were removed in #12a; the
      workspace is rebuilt each iteration by `loop/workspace.py`.
    enabled: true
  - id: memory_worker
    summary: Handle background jobs for durable memory operations
    detail: >
      A background worker dedicated to processing durable memory-related tasks,
      ensuring efficient and asynchronous memory management. Implemented in
      `memory_worker.py`.
    enabled: true
  - id: season_awareness
    summary: Know the current season and what is going on around the house
    detail: >
      Every system prompt carries `[いまの季節とまわり]`. The solar-term line (e.g. past the
      autumn equinox, next is 寒露) is computed from today's date each time. Once a day,
      when nobody is around, the REST pass's season layer searches the web for the town
      written in ME.md (weather and seasonal topics) and, together with that night's
      events, writes up to two lines each for weather, surroundings and family topics.
      Each line must quote the search result or cite an event, or nothing is stored.
      Older than 7 days it is marked with its age; older than 30 days only the solar-term
      line remains. `/season clear` wipes it. Stored in `agent_state.season_env`.
      Implemented in `core/season_env.py` and `loop/rest_season.py`.
    enabled: true
