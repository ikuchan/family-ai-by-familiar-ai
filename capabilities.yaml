capabilities:
  - id: autonomous_initiation
    summary: Initiate conversation or internal processing from inner desire without waiting for user input
    detail: >
      When FAMILIAR_AUTO_DESIRE=1, desire levels grow over time. Desires are split
      into two categories. Social desires (greet_companion, share_memory, worry_companion,
      care, attachment, repair, play) cause the agent to speak to the user and use the
      full conversation backend. Internal desires (look_around, explore, consolidate,
      reflect, curiosity, browse_curiosity, rest) run background processing using a
      lightweight backend. DESIRE_COOLDOWN controls the growth rate of social desires;
      INTERNAL_DESIRE_COOLDOWN controls internal desires independently (default: faster).
      Social desires are gated by presence: when a camera is active, the agent only
      speaks if a person is detected; without a camera, only within 5 minutes of the
      last user message. When an internal turn finds something notable (scene change,
      memory discovery, curiosity trigger), share_memory is automatically boosted so
      the agent will bring it up when the user is next present.
    enabled: true

  - id: camera_vision
    summary: Capture and interpret images from a camera (RTSP or USB webcam)
    detail: >
      look_around() captures a frame and describes the scene using a vision LLM.
      Scene changes are tracked; new/disappeared entities trigger workspace events.
      Uses the `tools/camera.py` module and can be configured via `CAMERA_HOST` or by detecting a USB webcam.
    enabled_env: CAMERA_HOST or USB webcam

  - id: coding_tools
    summary: Read, edit, glob, grep, and execute shell commands
    detail: >
      Provides CC-style file manipulation capabilities. Supports reading and modifying
      code, searching the codebase, and running shell commands. Paths are resolved
      relative to `CODING_WORKDIR`. Uses the `tools/coding.py` module.
    enabled: true

  - id: deferred_fetch
    summary: Asynchronously fetch content from a URL and inject it on the next turn
    detail: >
      Used for fire-and-forget URL fetching. The result is made available in the
      agent's workspace on the subsequent turn. Implemented in `tools/deferred_fetch.py`.
    enabled: true

  - id: deferred_search
    summary: Asynchronously perform a search and inject results on the next turn
    detail: >
      Enables fire-and-forget search queries. The search results are delivered to
      the agent's workspace on the subsequent turn. Implemented in `tools/deferred_search.py`.
    enabled: true

  - id: memory
    summary: Store and recall observations, episodes, semantic facts, and unfinished business
    detail: >
      Observations are embedded and stored in PostgreSQL with pgvector for vector
      search. Recall uses cosine similarity over situated embeddings. Episodes group
      related memories. Semantic facts and behavior policies are extracted from
      observations. Uses the `tools/memory.py` module and `DATABASE_URL` environment variable.
    enabled: true

  - id: mic_capture
    summary: Capture audio from a microphone
    detail: >
      Streams PCM 16 kHz 16-bit mono audio to an async callback. Primarily used
      for speech input. Implemented in `tools/mic.py`.
    enabled: true

  - id: mobility
    summary: Control physical movement (vacuum robot body)
    detail: >
      Provides control over the agent's physical movement, typically a robot vacuum.
      The `walk(direction, steps)` function moves the body. The camera view is
      independent of movement. Uses the `tools/mobility.py` module and can be
      configured via `MOBILITY_BACKEND`.
    enabled_env: MOBILITY_BACKEND

  - id: person_identification
    summary: Identify and track persons in the environment
    detail: >
      Tools for person identification and presence detection. This module
      interfaces with camera and voice data to recognize individuals. Uses
      the `tools/person.py` module.
    enabled: true

  - id: realtime_stt
    summary: Transcribe spoken audio in real-time using ElevenLabs
    detail: >
      Utilizes the ElevenLabs WebSocket API for real-time Speech-to-Text (Scribe v2).
      It maintains a persistent WebSocket connection and streams PCM audio,
      leveraging ElevenLabs VAD for speech boundary detection. Implemented in
      `tools/realtime_stt.py`.
    enabled_env: STT_BACKEND and microphone available

  - id: stt
    summary: Transcribe spoken audio using ElevenLabs Scribe API
    detail: >
      Performs Speech-to-Text transcription using the ElevenLabs Scribe API.
      It can record audio from the local PC microphone (via sounddevice) or
      a camera RTSP stream (via PyAV) as a fallback. Implemented in `tools/stt.py`.
    enabled_env: STT_BACKEND and microphone available

  - id: theory_of_mind
    summary: Enable perspective-taking and social reasoning
    detail: >
      The Theory of Mind tool helps the agent understand and reason about the
      mental states of others before responding. This is crucial for empathetic
      and contextually aware interactions. Implemented in `tools/tom.py`.
    enabled: true

  - id: tts
    summary: Speak responses aloud via text-to-speech
    detail: >
      The Text-to-Speech tool generates spoken output for the agent. It supports
      backends like ElevenLabs and go2rtc for camera speakers. VoiceGuard prevents
      TTS output from feeding back into STT. Implemented in `tools/tts.py`.
    enabled_env: TTS_BACKEND

  - id: desire_system
    summary: Drive autonomous motivations and goal-directed behavior
    detail: >
      The desire system provides the agent with autonomous motivations, enabling
      goal-directed behavior. It influences the agent's actions and decision-making
      process. Implemented in `desires.py`.
    enabled: true

  - id: relationship_tracker
    summary: Track longitudinal relationship state with each known person
    detail: >
      Maintains persistent metadata about the agent's relationships, including
      trust, intimacy, session counts, and support patterns. This state is
      persisted in the PostgreSQL database. Implemented in `relationship.py`.
    enabled: true

  - id: appraisal_engine
    summary: Deterministically update affective state based on inputs
    detail: >
      The deterministic appraisal engine updates the agent's low-dimensional
      affective state (e.g., valence, arousal) based on incoming information.
      Implemented in `appraisal.py`.
    enabled: true

  - id: social_policy
    summary: Explicit layer for turn-level interaction decisions
    detail: >
      This module provides an explicit social-policy layer that guides the agent's
      interaction decisions on a turn-by-turn basis, ensuring appropriate social
      behavior. Implemented in `social_policy.py`.
    enabled: true

  - id: self_narrative
    summary: Maintain a first-person autobiographical diary of sessions
    detail: >
      The agent maintains a persistent, first-person diary of its sessions,
      recording key events and experiences. This narrative helps in self-reflection
      and continuity. Implemented in `self_narrative.py`.
    enabled: true

  - id: mcp_client
    summary: Manage connections to external MCP servers
    detail: >
      The Model Context Protocol (MCP) client manager handles connections to external
      MCP servers, exposing their tools to the agent. Supported transports include
      stdio and SSE. Implemented in `mcp_client.py`.
    enabled_env: MCP_CONFIG

  - id: interoception_bridge
    summary: Provide and semantically map internal bodily signals
    detail: >
      The interoception bridge connects to providers of internal bodily signals
      and maps them semantically, contributing to the agent's self-awareness.
      Implemented in `interoception.py`.
    enabled: true

  - id: default_mode_network
    summary: Process spontaneous memory recall during idle time
    detail: >
      Inspired by the brain's Default Mode Network, this processor wanders through
      past memories during idle periods, surfacing associations and consolidating
      memories. Implemented in `default_mode.py`.
    enabled: true

  - id: prediction_error_engine
    summary: Minimize prediction error based on the Free Energy Principle
    detail: >
      This engine operates on Friston's Free Energy Principle, aiming to minimize
      prediction error by updating probability estimates using Exponential Moving
      Averages. Implemented in `prediction.py`.
    enabled: true

  - id: global_workspace
    summary: Integrate information from various processing modules
    detail: >
      The Global Workspace, inspired by GWT/GNWT, acts as an integration layer
      where specialized processors compete for a shared workspace, broadcasting
      their content. Implemented in `workspace.py`.
    enabled: true

  - id: memory_worker
    summary: Handle background jobs for durable memory operations
    detail: >
      A background worker dedicated to processing durable memory-related tasks,
      ensuring efficient and asynchronous memory management. Implemented in
      `memory_worker.py`.
    enabled: true

  - id: meta_monitor
    summary: Monitor metacognitive state and update self-model
    detail: >
      The MetaMonitor, implementing a Higher-Order Theory (HOT) layer, records
      metacognitive states, detects inconsistencies, and produces session summaries
      for diary and self-model updates. Implemented in `meta_monitor.py`.
    enabled: true

  - id: tape_planning
    summary: Implement TAPE-inspired planning for embodied agents
    detail: >
      Adapts TAPE planning for embodied agents, including lightweight plan generation
      and adaptive replanning mechanisms to guide action sequences. Implemented in
      `tape.py`.
    enabled: true

  - id: concern_engine
    summary: Manage lightweight active concerns for self-continuity
    detail: >
      This engine manages lightweight active concerns, contributing to the agent's
      sense of autobiographical self-continuity across its experiences. Implemented
      in `concern_engine.py`.
    enabled: true

  - id: face_recognition
    summary: Identify known persons from camera frames
    detail: >
      The CameraPresenceWatcher polls the camera, runs face recognition, and updates
      PersonMemoryManager. Memory and relationship context switch to the identified
      person automatically. Requires face embeddings registered via `/register_face`.
    enabled_env: requires face embeddings registered via /register_face

  - id: voice_identification
    summary: Identify known persons by voice print (speaker diarization)
    detail: >
      VoiceIdentifier uses resemblyzer to embed utterances and match against
      registered voice profiles. Currently implemented but NOT yet wired into
