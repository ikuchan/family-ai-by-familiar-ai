capabilities:
  - id: autonomous_initiation
    summary: Initiate conversation or internal processing from inner desire without waiting for user input
    detail: >
      When FAMILIAR_AUTO_DESIRE=1, desire levels grow over time. Desires are split
      into two categories. Social desires (greet_companion, share_memory, worry_companion,
      care, attachment, repair, play, share_search_result) cause the agent to speak to
      the user and use the full conversation backend. Internal desires (look_around,
      explore, consolidate, reflect, curiosity, browse_curiosity, rest, self_protect)
      run background processing using a lightweight backend. DESIRE_COOLDOWN controls
      the growth rate of social desires; INTERNAL_DESIRE_COOLDOWN controls internal
      desires independently (default: faster). Note: repair and self_protect have a
      growth rate of 0.0 and only activate via boost(). share_search_result fires
      automatically when a deferred search result is ready to deliver.
      Social desires are gated by presence: when a camera is active, the agent only
      speaks if a person is detected; without a camera, only within 5 minutes of the
      last user message. When an internal turn finds something notable (scene change,
      memory discovery, curiosity trigger), share_memory is automatically boosted so
      the agent will bring it up when the user is next present.
    enabled: true
  - id: camera_vision
    summary: Capture and interpret images from a camera (RTSP or USB webcam)
    detail: >
      `see()` captures a camera frame and describes the scene via vision LLM.
      `look(direction, degrees)` rotates the camera head via ONVIF PTZ.
      Camera view is independent of mobility. Uses the `tools/camera.py` module.
    enabled_env: CAMERA_HOST
  - id: coding_tools
    summary: Read, edit, glob, grep, and execute shell commands
    detail: >
      Provides CC-style file manipulation capabilities. Supports reading and modifying
      code, searching the codebase, and running shell commands. Paths are resolved
      relative to `CODING_WORKDIR`. Uses the `tools/coding.py` module.
    enabled: true
  - id: deferred_fetch
    summary: Asynchronously fetch content from a URL and inject it on the next turn
    detail: >
      Used for fire-and-forget URL fetching. The result is made available in the
      agent's workspace on the subsequent turn. Implemented in `tools/deferred_fetch.py`.
    enabled: true
  - id: deferred_search
    summary: Asynchronously perform a search and inject results on the next turn
    detail: >
      Enables fire-and-forget search queries. The search results are delivered to
      the agent's workspace on the subsequent turn. Implemented in `tools/deferred_search.py`.
    enabled: true
  - id: memory
    summary: Store and recall observations, episodes, semantic facts, and unfinished business
    detail: >
      Observations are embedded and stored in PostgreSQL with pgvector for vector
      search. Recall uses cosine similarity over situated embeddings. Episodes group
      related memories. Semantic facts and behavior policies are extracted from
      observations. Uses the `tools/memory.py` module and `DATABASE_URL` environment variable.
    enabled: true
  - id: mic_capture
    summary: Capture audio from a microphone
    detail: >
      Streams PCM 16 kHz 16-bit mono audio to an async callback. Primarily used
      for speech input. Implemented in `tools/mic.py`.
    enabled: true
  - id: mobility
    summary: Control physical movement (vacuum robot body)
    detail: >
      Provides control over the agent's physical movement, typically a robot vacuum.
      The `walk(direction, duration)` function moves the body. The camera view is
      independent of movement. Uses the `tools/mobility.py` module and is configured via
      `TUYA_REGION`, `TUYA_API_KEY`, `TUYA_API_SECRET`.
    enabled_env: MOBILITY_BACKEND
  - id: person_identification
    summary: Identify and track multiple family members as distinct individuals
    detail: >
      The agent is designed for shared household use: multiple family members
      interact with the same instance, each with a separate memory space,
      relationship state, and perspective vector. PersonMemoryManager routes
      memory writes to the current speaker and reads across all present persons.
      Identification uses face recognition (CameraPresenceWatcher) or voice print
      (VoiceIdentifier). Uses the `tools/person.py` and `person_memory_manager.py`
      modules.
    enabled: true
  - id: realtime_stt
    summary: Transcribe spoken audio in real-time
    detail: >
      Continuous listening. Audio is transcribed locally by faster-whisper by
      default (STT_ENGINE=whisper, model large-v3 on cuda, no API key needed), with
      silero-vad marking speech boundaries; STT_ENGINE=elevenlabs switches to the
      ElevenLabs WebSocket API (Scribe v2) instead. Implemented in
      `tools/realtime_stt.py` and `realtime_stt_session.py`.
    enabled: true
  - id: stt
    summary: Transcribe a recorded stretch of spoken audio
    detail: >
      Records audio from the local PC microphone (via sounddevice) or a camera RTSP
      stream (via PyAV) as a fallback, then transcribes it. Transcription runs
      locally on faster-whisper by default (STT_ENGINE=whisper, no API key needed);
      STT_ENGINE=elevenlabs uses the ElevenLabs Scribe API instead. Implemented in
      `tools/stt.py` and `tools/local_stt.py`.
    enabled: true
  - id: tts
    summary: Speak responses aloud via text-to-speech
    detail: >
      The Text-to-Speech tool generates spoken output for the agent. Synthesis runs
      locally on a Style-Bert-VITS2 server by default (TTS_ENGINE=sbv2, voice
      jvnv-M2-jp, no API key needed); TTS_ENGINE=elevenlabs switches to the external
      API. Audio plays on the PC speaker and/or a camera speaker via go2rtc.
      VoiceGuard prevents TTS output from feeding back into STT. Implemented in
      `tools/tts.py`.
    enabled: true
  - id: desire_system
    summary: Drive autonomous motivations and goal-directed behavior
    detail: >
      The desire system provides the agent with autonomous motivations, enabling
      goal-directed behavior. It influences the agent's actions and decision-making
      process. Implemented in `desires.py`.
    enabled: true
  - id: relationship_tracker
    summary: Track longitudinal relationship state independently for each family member
    detail: >
      Each registered person has their own relationship record, including trust,
      intimacy, session counts, and support patterns. The agent maintains distinct
      rapport with each family member and adapts its behavior accordingly.
      State is persisted in the PostgreSQL `relationship_state` table.
      Implemented in `relationship.py`.
    enabled: true
  - id: appraisal_engine
    summary: Deterministically update affective state based on inputs
    detail: >
      Affective state is updated each turn from the PAD values the utility LLM
      returns for the incoming observation. The judging prompt and the parsing live
      in `loop/evaluator.py`; the PAD dataclass, the label quantisation and the
      mood register live in `emotion_pad.py` and `mood_register.py`.
    enabled: true
  - id: self_narrative
    summary: Maintain a first-person autobiographical diary of sessions
    detail: >
      The agent maintains a persistent, first-person diary of its sessions,
      recording key events and experiences. This narrative helps in self-reflection
      and continuity. Implemented in `self_narrative.py`.
    enabled: true
  - id: mcp_client
    summary: Manage connections to external MCP servers
    detail: >
      The Model Context Protocol (MCP) client manager handles connections to external
      MCP servers, exposing their tools to the agent. Supported transports include
      stdio and SSE. Implemented in `mcp_client.py`.
    enabled_env: MCP_CONFIG
  - id: house_rules
    summary: Look up the rules the family currently lives by
    detail: >
      `get_house_rules` returns the household rules in force right now — which
      days games and YouTube are allowed, how long, breaks, the three minutes of
      exercise on getting home. The reply already says what day it is in JST and
      whether today is a game day, so there is no need to work that out.
      Use it when a child asks whether they may play, or whenever the rules
      themselves matter. It returns what is agreed now, not a memory of a past
      conversation — and it says when it was last updated.
      The rules live in the family's notes, not in the agent's memory, so they
      are never mixed into recall. Anyone in the family may ask.
      Treated as a tool: read it when the question needs what is written down,
      not on every turn.
    enabled_env: MCP_CONFIG
  - id: family_notes_deep_question
    summary: Ask a long question of the family's own written records (Yusuke only)
    detail: >
      `ask_vault_yusuke` is not a search. A session that can read the whole
      three-year archive of notes reads, thinks, and answers — so it takes tens
      of seconds and must ride the deferred path, never a synchronous wait.
      NOT CONNECTED YET (2026-09-04). The archive holds private material, so this
      tool must be absent from the tool list on anyone else's turn. The speaker
      gate is this side's responsibility — the server cannot see who is talking.
      Until that gate exists, this capability stays off. See the design note
      `設計方針_家の記録との接続`.
    enabled: false
  - id: default_mode_network
    summary: Process spontaneous memory recall during idle time
    detail: >
      Inspired by the brain's Default Mode Network. On idle cycles (no workspace
      winner) the agent refreshes its self-understanding from capabilities.yaml.
      Driven from `agent.py` and `capability_state.py`.
    enabled: true
  - id: prediction_error_engine
    summary: Minimize prediction error based on the Free Energy Principle
    detail: >
      This engine operates on Friston's Free Energy Principle, aiming to minimize
      prediction error by updating probability estimates using Exponential Moving
      Averages. Implemented in `prediction.py`.
    enabled: true
  - id: global_workspace
    summary: Integrate information from various processing modules
    detail: >
      The Global Workspace, inspired by GWT/GNWT, acts as an integration layer
      where specialized processors compete for a shared workspace, broadcasting
      their content. Implemented in `workspace.py`.
    enabled: true
  - id: memory_worker
    summary: Handle background jobs for durable memory operations
    detail: >
      A background worker dedicated to processing durable memory-related tasks,
      ensuring efficient and asynchronous memory management. Implemented in
      `memory_worker.py`.
    enabled: true
  - id: tape_planning
    summary: Implement TAPE-inspired planning for embodied agents
    detail: >
      Adapts TAPE planning for embodied agents, including lightweight plan generation
      and adaptive replanning. Kept in `legacy/tape.py`; **no production caller
      remains** — scheduled for removal with the retired stores.
    enabled: true
  - id: concern_engine
    summary: Manage lightweight active concerns for self-continuity
    detail: >
      This engine manages lightweight active concerns, contributing to the agent's
      sense of autobiographical self-continuity across its experiences.
      Implemented in `concern_
