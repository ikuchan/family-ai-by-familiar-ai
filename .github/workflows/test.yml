name: Test

on:
  push:
    branches: [main, develop]
  # Run CI on stacked PRs too. `pull_request.branches` filters by base branch,
  # so limiting it to main/develop skips PRs targeting intermediate stack branches.
  pull_request:

jobs:
  test:
    # The app runs on one Linux machine at home (2026-11-23, owner's decision). Tests need the
    # PostgreSQL test DB on port 5433 (tests/conftest.py, tests/_db_guard.py), the same as
    # `docker compose --profile test` in docker-compose.yml.
    runs-on: ubuntu-latest
    services:
      db-test:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: familiar
          POSTGRES_PASSWORD: familiar
          POSTGRES_DB: familiar_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U familiar -d familiar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install GUI test deps
        run: sudo apt-get update && sudo apt-get install -y libegl1

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --group dev pytest --tb=short -q -n 4
